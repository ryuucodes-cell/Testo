<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Zippy_Cut_Pro</title>
<style>
/* Zippy_Recap 0.3.0 — 💬 one chat screen (Zippy_Cut style): ☰ projects · chat with live cards · ✏️ editor mode · 🎬 render in the chat.
   Dark green + gold. */
:root{
  --bg:#07130e;--bg2:#0c1c15;--card:#10261c;--card2:#163225;--line:#1f3d2d;--line2:#2c5a41;
  --text:#f4f0df;--mute:#b8c6ad;--dim:#7d927f;
  --g1:#fbe6a2;--g2:#e9b949;--g3:#b8862b;--on:#1f1600;
  --gold:linear-gradient(135deg,#fbe6a2 0%,#e9b949 48%,#b8862b 100%);
  --ok:#8fdca0;--warn:#f1c45f;--bad:#f2907e;
  --r:16px;--font:"Noto Sans Myanmar","Pyidaungsu","Myanmar Text",system-ui,-apple-system,sans-serif;
  color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:15px/1.55 var(--font)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--g2);outline-offset:2px}
input,textarea,select{font:inherit;color:inherit}
.gtxt{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.dim{color:var(--dim)}.mute{color:var(--mute)}.small{font-size:12.5px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}

#app{height:100%;max-width:620px;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);position:relative;overflow:hidden;
  background:radial-gradient(130% 55% at 50% -12%,#2e3b1255,transparent 60%),var(--bg)}
header{display:flex;align-items:center;gap:8px;padding:8px 10px 8px;border-bottom:1px solid var(--line);min-width:0}
.icon{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:17px;flex:none;display:grid;place-items:center}
.icon.on{background:var(--gold);color:var(--on);border-color:transparent}
.ttl{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.ttl b{font-size:16px;line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttl small{font-size:11.5px;color:var(--mute);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

main{position:relative;min-height:0;overflow:hidden}
#chat{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 12px 16px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
#chat::-webkit-scrollbar{display:none}
.msg{display:flex;flex-direction:column;gap:6px;max-width:92%}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.bot{align-self:flex-start}
.bub{padding:9px 13px;border-radius:16px;white-space:pre-wrap;word-break:break-word}
.me .bub{background:var(--gold);color:var(--on);border-bottom-right-radius:5px;font-weight:600}
.bot .bub{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.bub code{font-family:ui-monospace,Menlo,monospace;font-size:.88em;background:#0006;padding:0 4px;border-radius:5px}
.me .bub code{background:#0002}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:5px 13px;border-radius:999px;border:1px solid var(--g3);background:#e9b9491a;color:var(--g1);font-weight:700;font-size:13.5px}
.chip.pri{background:var(--gold);color:var(--on);border-color:transparent}
.old .chip{opacity:.55}
.day{align-self:center;font-size:11px;color:var(--dim);padding:2px 10px;border:1px solid var(--line);border-radius:99px}

/* live cards in the chat */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;width:min(100%,430px);display:flex;flex-direction:column;gap:8px}
.card.gold{border-color:var(--g3);box-shadow:0 0 0 1px #e9b94922 inset}
.ch{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ch b{font-size:15px}
.facts{display:flex;flex-wrap:wrap;gap:5px}
.facts span{font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);color:var(--mute)}
.do{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.do .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:800;background:var(--card2);color:var(--mute)}
.do.now{border-color:var(--g3)}.do.now .n{background:var(--gold);color:var(--on)}
.do.ok .n{background:#245a39;color:var(--ok)}
.do .t{min-width:0;display:flex;flex-direction:column;line-height:1.35}
.do .t b{font-size:13.5px}.do .t small{font-size:11.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis}
.do .a{display:flex;gap:5px}
.bar1{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:3px}.bar1 i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
.btn{min-height:40px;border-radius:12px;border:1px solid var(--line2);background:var(--card2);padding:5px 13px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.gold{background:var(--gold);color:var(--on);border-color:transparent;box-shadow:0 5px 16px #e9b94930}
.btn.sm{min-height:34px;padding:3px 11px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sum3 div{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:6px 4px;text-align:center}
.sum3 b{display:block;font-size:17px;font-variant-numeric:tabular-nums}.sum3 span{font-size:11px;color:var(--dim)}
.sum3 .good b{color:var(--ok)}.sum3 .warn b{color:var(--warn)}
.ringw{display:flex;align-items:center;gap:14px}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-size:19px;font-variant-numeric:tabular-nums}
.rtxt{display:flex;flex-direction:column;gap:3px;min-width:0}
.cut .big{display:flex;align-items:baseline;gap:10px}
.cut .big b{font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.vp .bar2{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:2px 0}
.vp .bar2 i{display:block;height:100%;background:var(--gold);border-radius:5px;transition:width .4s}
.cut .bar2{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.cut .bar2 i{display:block;height:100%;width:0;background:var(--gold);border-radius:5px;transition:width .25s}
.cut .bar2.wait i{width:30%!important;animation:slide 1.1s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(-10%)}to{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){.cut .bar2.wait i{animation:none}}
.ytU{overflow-wrap:anywhere}
.cut .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.rtxt b{font-size:14px}.rtxt span{font-size:12px;color:var(--mute)}

/* composer */
.composer{border-top:1px solid var(--line);padding:8px 10px 10px;display:flex;gap:7px;align-items:flex-end;background:var(--bg)}
#msgIn{flex:1;min-width:0;resize:none;max-height:120px;min-height:42px;padding:9px 13px;border-radius:21px;border:1px solid var(--line2);background:var(--card);line-height:1.45}
#sendBtn{width:42px;height:42px;border-radius:50%;background:var(--gold);color:var(--on);font-size:18px;font-weight:900;flex:none}
#plusBtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line2);background:var(--card);font-size:22px;flex:none}
.plus{position:absolute;left:10px;bottom:62px;z-index:8;background:var(--card2);border:1px solid var(--line2);border-radius:16px;padding:6px;display:flex;flex-direction:column;min-width:220px;box-shadow:0 12px 40px #0009}
.plus button{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:11px;text-align:left;font-weight:700}
.plus button:hover{background:var(--card)}
.plus i{font-style:normal;font-size:18px;width:24px;text-align:center}

/* ✏️ editor mode (inside the chat area) */
#editor{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:5}
.etabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 10px}
.etab{padding:8px 4px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);font-weight:800;font-size:13px;color:var(--mute)}
.etab.on{background:var(--card2);border-color:var(--g3);color:var(--g1)}
#ebody{flex:1;min-height:0;overflow-y:auto;padding:2px 10px 12px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
#ebody::-webkit-scrollbar{display:none}
.efoot{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--line)}
.efoot .btn{flex:1}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.strip::-webkit-scrollbar{display:none}
.pc{flex:none;min-width:44px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);font-weight:800;display:flex;align-items:center;justify-content:center;gap:5px;font-size:13.5px}
.pc i{width:8px;height:8px;border-radius:50%;background:var(--line2)}
.pc.file i{background:var(--warn)}.pc.done i{background:var(--ok)}.pc.warn i{background:#f0a35f}
.pc.on{border-color:var(--g2);background:var(--card2)}
.zl{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.zl span{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font:800 12px ui-monospace,monospace;background:var(--bg2);border:1px solid var(--line)}
.zl span.ok{color:var(--ok)}.zl span.bad{color:var(--bad);border-color:#f2907e88}.zl small{color:var(--dim);font-size:11.5px;margin-left:4px}
.ptools{display:flex;gap:6px;flex-wrap:wrap}
.pln{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line2);border-radius:13px;padding:8px}
.pln.ZOOM{border-left-color:#f0a3c8}.pln.SLOW{border-left-color:#9fc6ff}.pln.CUTS{border-left-color:#f1c45f}.pln.PLAY{border-left-color:#8fdca0}
.pln.now{box-shadow:0 0 0 2px var(--g2)}
.prow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.let{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:800 14px ui-monospace,monospace;background:var(--bg2);border:1px solid var(--line2);flex:none}
.let.ok{color:var(--ok)}.let.bad{color:var(--bad);border-color:#f2907e88}
.shots{display:flex;gap:3px;flex-wrap:wrap}
.shots button{font:11.5px ui-monospace,monospace;padding:4px 7px;border-radius:8px;border:1px solid var(--line2);background:var(--bg2);color:var(--mute)}
.shots button.on[data-s="ZOOM"]{background:#f0a3c8;color:#2a0a1a}.shots button.on[data-s="SLOW"]{background:#9fc6ff;color:#071a33}
.shots button.on[data-s="CUTS"]{background:#f1c45f;color:#2a1d00}.shots button.on[data-s="PLAY"]{background:#8fdca0;color:#062010}
.shots button.on{border-color:transparent}
.vsec{margin-left:auto;font:11.5px ui-monospace,monospace;color:var(--mute);border:1px solid var(--line2);border-radius:999px;padding:2px 8px}.vsec.ok{color:var(--ok)}
.tin{display:flex;gap:4px 8px;align-items:center;flex-wrap:wrap;min-width:0}
.tin input{flex:1 1 150px;min-width:0;background:var(--bg2);border:1px solid var(--line2);border-radius:9px;padding:5px 8px;font:13px ui-monospace,monospace}
.tin small{color:var(--dim);font:11px ui-monospace,monospace}
.pln textarea{width:100%;resize:vertical;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;line-height:1.6;min-height:60px}
.segs{display:flex;gap:3px;height:20px;border-radius:6px;overflow:hidden;background:var(--bg2)}
.segs i{display:flex;align-items:center;justify-content:center;font:normal 10px ui-monospace,monospace;color:#0b1a12;white-space:nowrap;overflow:hidden;min-width:0}
.segs i.CL{background:#8fdca0}.segs i.FR{background:#9fc6ff}.segs i.TK{background:#f0a3c8}
.phs{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.phc{font:11px ui-monospace,monospace;color:var(--mute);background:var(--bg2);border:1px solid var(--line);border-radius:7px;padding:1px 6px}
.talk{display:flex;flex-direction:column;gap:5px;margin-left:14px;padding:6px 8px;border-left:3px solid #f0a3c8;background:var(--bg2);border-radius:10px}
.talk .tl{font-size:12.5px;color:#f0a3c8;white-space:nowrap}
.talk textarea{min-height:40px}
#fake{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:16px}
#fake .pic{aspect-ratio:16/9;max-width:100%;background:linear-gradient(135deg,#1c3a2b,#0a1510);border-radius:8px;display:grid;place-items:center;font:16px ui-monospace,monospace;color:var(--g1);transition:transform linear}
#fake .cap{color:#fff;background:#0009;padding:8px 12px;border-radius:10px}
.ln{display:grid;grid-template-columns:1fr auto;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:7px 8px}
.ln .tm{font-size:11.5px;color:var(--g1);font-variant-numeric:tabular-nums;text-align:left;padding:2px 6px;border-radius:7px;background:var(--bg2);border:1px solid var(--line)}
.ln .lb{display:flex;gap:5px}
.ln .lb button{width:34px;height:30px;border-radius:9px;background:var(--bg2);border:1px solid var(--line)}
.ln textarea{grid-column:1/-1;width:100%;resize:none;border:0;background:transparent;line-height:1.55;padding:2px 2px;min-height:44px;overflow:hidden}
.lbl{font-size:11.5px;font-weight:800;color:var(--mute);letter-spacing:.3px;margin:2px 2px 0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;min-width:0}
.sg{min-height:42px;min-width:0;white-space:nowrap;overflow:hidden;border-radius:12px;border:1px solid var(--line);background:var(--bg2);font-weight:800;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:3px 4px}
.sg small{font-weight:600;font-size:10.5px;color:var(--dim)}
.sg.on{background:var(--gold);color:var(--on);border-color:transparent}.sg.on small{color:#5a4210}
.vlist{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.vo{padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);text-align:left;display:flex;flex-direction:column}
.vo b{font-size:14px}.vo small{font-size:11px;color:var(--dim)}
.vo.on{border-color:var(--g2);background:var(--card2)}
.rate{display:flex;align-items:center;gap:10px}
.vc .vrow{display:flex;gap:6px;flex-wrap:wrap}
.vc .vb{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--bg2);overflow:hidden}
.vc .vb.on{border-color:var(--g2);background:var(--card2)}
.vc .vb button{padding:7px 10px;font-weight:700;font-size:13.5px;min-height:38px}
.vc .vb .h{border-left:1px solid var(--line);padding:7px 9px}
.vc .step{display:flex;align-items:center;gap:8px;justify-content:space-between}
.vc .step .pm{display:flex;align-items:center;gap:6px}
.vc .step .pm b{min-width:62px;text-align:center;font-variant-numeric:tabular-nums}
.vc .step .pm button{width:36px;height:34px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);font-weight:900}
.rate input{flex:1;accent-color:var(--g2)}
.rate b{min-width:48px;text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:26px 12px;text-align:center;color:var(--mute)}
.warnl{font-size:12px;color:var(--warn);background:#f1c45f12;border:1px solid #f1c45f40;border-radius:11px;padding:6px 9px}

/* ☰ drawer */
.shade{position:absolute;inset:0;background:#000a;z-index:20}
.drawer{position:absolute;top:0;bottom:0;left:0;width:min(84%,340px);background:var(--bg2);border-right:1px solid var(--line2);z-index:21;display:flex;flex-direction:column;animation:dr .18s ease}
@keyframes dr{from{transform:translateX(-24px);opacity:.5}}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:14px 12px 10px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--gold);display:grid;place-items:center;font-size:19px;flex:none}
.dh b{font-size:17px}.dh small{display:block;font-size:11px;color:var(--dim)}
.plist{flex:1;overflow-y:auto;padding:4px 8px;display:flex;flex-direction:column;gap:5px}
.pj{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:9px 10px;border-radius:13px;border:1px solid transparent;text-align:left}
.pj.on{background:var(--card2);border-color:var(--g3)}
.pj .t{min-width:0}.pj .t b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pj .t small{font-size:11.5px;color:var(--dim)}
.pj .x{width:32px;height:32px;border-radius:9px;color:var(--dim)}
.dfoot{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}

/* sheet */
.ov{position:absolute;inset:0;background:#000a;z-index:30;display:none;align-items:flex-end}
.ov.open{display:flex}
.sheet{width:100%;max-height:86%;background:var(--bg2);border:1px solid var(--line2);border-bottom:0;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .18s ease}
@keyframes up{from{transform:translateY(20px);opacity:.5}}
@media (prefers-reduced-motion:reduce){.sheet,.drawer{animation:none}}
.sheet .hd{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
.sheet .hd b{flex:1;font-size:16px}
.sheet .bd{overflow-y:auto;padding:4px 14px 10px}
.sheet .ft{display:flex;gap:8px;padding:10px 14px 14px}
.sheet .ft .btn{flex:1}
.sheet .msgt{white-space:pre-wrap;color:var(--mute)}
.sheet textarea,.sheet input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--card)}
.sheet textarea{min-height:220px;resize:vertical}
.toast{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);background:var(--g1);color:var(--on);font-weight:700;padding:8px 14px;border-radius:12px;font-size:13.5px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
.toast.on{opacity:1}

/* 0.0.7 🎬 Studio */
.stg{position:relative;background:#000;border-radius:14px;overflow:hidden;height:200px;flex:none;cursor:pointer}
#ebody.studio{overflow:hidden;gap:8px}
.stTop{flex:none;display:flex;flex-direction:column;gap:7px}
.stScroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:6px;scrollbar-width:none}
.stScroll::-webkit-scrollbar{display:none}
.stTop .strip .pc{height:32px;min-width:38px}
.stTr{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;object-fit:fill}
.stno{position:absolute;inset:0;width:100%;height:100%;display:grid;place-items:center;color:var(--mute);font:600 15px ui-monospace,monospace;background:repeating-linear-gradient(45deg,#0c1c15,#0c1c15 12px,#10261c 12px,#10261c 24px)}
.sbadge{position:absolute;z-index:3;left:8px;top:6px;font:700 11.5px ui-monospace,monospace;background:#000a;color:var(--g1);padding:2px 8px;border-radius:8px;pointer-events:none}
.stg .stc{position:absolute;z-index:3;right:8px;top:6px;font:11.5px ui-monospace,monospace;background:#000a;color:#fff;padding:2px 8px;border-radius:8px;pointer-events:none}
.scap{position:absolute;left:6%;right:6%;bottom:8px;text-align:center;color:#fff;font-size:14px;line-height:1.5;text-shadow:0 1px 3px #000,0 0 6px #000;pointer-events:none;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sbig{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:#000a;color:#fff;display:grid;place-items:center;font-size:24px;pointer-events:none}
.stx{display:flex;align-items:center;gap:6px}

/* ═══════════ 0.1.0 Quality skin — calm, simple, one gold action per screen ═══════════
   Same chat flow, same buttons, same places. What changed: gold only where you act (the main button,
   the active choice) · quiet surfaces · one radius · one spacing scale · softer type. */
:root{
  --bg:#06110c;--bg2:#0b1913;--card:#0e2019;--card2:#132a20;--line:#1b3328;--line2:#25443a;
  --text:#f3efe2;--mute:#b3bfae;--dim:#7c8f82;
  --g1:#f6e2a4;--g2:#e2b54a;--g3:#a98232;--on:#1d1503;
  --gold:linear-gradient(180deg,#f3d27a 0%,#e2b54a 55%,#c99a35 100%);
  --goldsoft:#e2b54a14;--goldline:#e2b54a55;
  --r:16px;--r2:12px;--sh:0 1px 0 #ffffff08 inset,0 8px 24px #00000040}
html,body{font:15px/1.6 var(--font);letter-spacing:.1px}
#app{background:radial-gradient(120% 40% at 50% -10%,#1d2a1440,transparent 65%),var(--bg)}
b,strong{font-weight:700}
/* header — quiet, the title first */
header{padding:10px 12px;gap:10px;border-bottom:1px solid var(--line);background:#06110cd9;backdrop-filter:blur(8px)}
.icon{width:40px;height:40px;border-radius:12px;border:1px solid transparent;background:transparent;font-size:18px;color:var(--mute)}
.icon:active{background:var(--card)}
#editBtn{border:1px solid var(--goldline);background:var(--goldsoft);color:var(--g1)}
.icon.on,#editBtn.on{background:var(--gold);color:var(--on);border-color:transparent}
.ttl b{font-size:16.5px;font-weight:700;letter-spacing:.1px}
.ttl small{font-size:12px;color:var(--dim);margin-top:1px}
/* chat — the bot talks on the page, you talk in a soft gold bubble */
#chat{padding:16px 14px 20px;gap:14px}
.msg{max-width:94%;gap:8px}
.bub{padding:10px 14px;border-radius:18px;line-height:1.62}
.bot .bub{background:transparent;border:0;padding:2px 2px;color:var(--text)}
.me .bub{background:var(--card2);color:var(--g1);border:1px solid var(--goldline);border-bottom-right-radius:6px;font-weight:600}
.me .bub code{background:#0004}
.day{border-color:var(--line);color:var(--dim);background:var(--bg2)}
/* chips — neutral; only the next step is gold */
.chips{gap:8px}
.chip{min-height:38px;padding:6px 15px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--text);font-weight:600;font-size:14px}
.chip:active{background:var(--card2)}
.chip.pri{background:var(--gold);color:var(--on);border-color:transparent;font-weight:700}
.old .chip{opacity:.4;filter:saturate(.6)}
/* cards — one surface, one radius */
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:14px;gap:10px;box-shadow:var(--sh);width:min(100%,440px)}
.card.gold{border-color:var(--goldline);box-shadow:var(--sh)}
.ch{gap:8px}.ch b{font-size:15.5px;font-weight:700}
.facts{gap:6px}
.facts span{font-size:12px;padding:2px 9px;background:transparent;border:1px solid var(--line2);color:var(--mute)}
.do{grid-template-columns:28px 1fr auto;gap:10px;padding:10px;border-radius:var(--r2);background:#ffffff05;border:1px solid var(--line)}
.do .n{width:26px;height:26px;font-size:12px;font-weight:700;background:var(--card2);color:var(--dim)}
.do.now{border-color:var(--goldline);background:var(--goldsoft)}
.do.now .n{background:var(--gold);color:var(--on)}
.do.ok .n{background:#1f4a32;color:var(--ok)}
.do .t b{font-size:14px;font-weight:700}.do .t small{font-size:12px}
/* buttons */
.btn{min-height:42px;border-radius:var(--r2);border:1px solid var(--line2);background:var(--card2);padding:6px 15px;font-weight:700;font-size:14px}
.btn:active{filter:brightness(1.15)}
.btn.gold{background:var(--gold);color:var(--on);border-color:transparent;box-shadow:0 4px 14px #e2b54a26}
.btn.sm{min-height:36px;padding:4px 12px;font-size:13px;border-radius:10px}
/* progress */
.bar1,.vp .bar2,.cut .bar2{background:#ffffff10}
.ring .c b{font-weight:700}
.sum3 div{background:#ffffff05;border-color:var(--line);border-radius:var(--r2);padding:8px 4px}
.sum3 b{font-weight:700}
/* composer — one pill */
.composer{padding:10px 12px 12px;gap:8px;background:var(--bg);border-top:1px solid var(--line)}
#msgIn{border-radius:22px;border:1px solid var(--line2);background:var(--card);padding:10px 16px;min-height:44px}
#msgIn:focus{outline:none;border-color:var(--goldline)}
#plusBtn{width:44px;height:44px;border:1px solid var(--line2);background:var(--card);color:var(--mute)}
#sendBtn{width:44px;height:44px}
.plus{left:12px;bottom:70px;border-radius:var(--r);padding:6px;background:var(--card2);border-color:var(--line2);box-shadow:0 16px 48px #000b}
.plus button{padding:11px 12px;border-radius:10px;font-weight:600}
.plus button:active{background:var(--card)}
/* editor — a segmented control on top */
.etabs{margin:10px 12px 4px;padding:4px;gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:14px}
.etab{border:0;background:transparent;border-radius:10px;padding:8px 4px;font-weight:700;font-size:13.5px;color:var(--dim)}
.etab.on{background:var(--card2);color:var(--g1);box-shadow:0 0 0 1px var(--goldline) inset}
#ebody{padding:6px 12px 12px}
.efoot{padding:10px 12px;gap:10px;background:var(--bg)}
.pc{height:36px;min-width:42px;border-radius:10px;border-color:var(--line);background:var(--bg2);font-weight:700;font-size:13px}
.pc.on{border-color:var(--goldline);background:var(--goldsoft);color:var(--g1)}
.lbl{font-size:12px;font-weight:700;color:var(--dim);letter-spacing:.4px;margin:6px 2px 0}
.sg{border-radius:var(--r2);border-color:var(--line);background:var(--bg2);font-weight:700}
.sg.on{background:var(--goldsoft);color:var(--g1);border-color:var(--goldline)}.sg.on small{color:var(--g2)}
.vo{border-radius:var(--r2)}.vo.on{border-color:var(--goldline);background:var(--goldsoft)}
.vc .vb{border-radius:var(--r2)}.vc .vb.on{border-color:var(--goldline);background:var(--goldsoft)}
.vc .step .pm button{border-radius:10px}
/* Studio */
.stg{border-radius:var(--r);border:1px solid var(--line)}
.stx button{border-radius:12px;border-color:var(--line2);background:var(--card)}
.stx .stplay{background:var(--gold);color:var(--on)}
.tl{border-radius:var(--r2);background:var(--bg2);border-color:var(--line)}
.stp{border-radius:var(--r);background:linear-gradient(180deg,var(--card),var(--bg2));border-color:var(--line);padding:12px}
.strow button{border-radius:10px;font-weight:600;border-color:var(--line2)}
.strow button.on{background:var(--goldsoft);border-color:var(--goldline)}
#fxTabs{gap:4px;padding:4px;background:var(--bg2);border:1px solid var(--line);border-radius:14px}
#fxTabs button{border:0;background:transparent;border-radius:10px;height:46px}
#fxTabs button.on{background:var(--card2);box-shadow:0 0 0 1px var(--goldline) inset}
.fxChip{border-radius:999px;font-weight:600;background:var(--card);border-color:var(--line2)}
.fxChip.on{background:var(--goldsoft);border-color:var(--goldline);color:var(--g1)}
.fxLabel{font-weight:700;color:var(--dim);letter-spacing:.4px;font-size:12px;margin-top:6px}
.fxFrame{border-radius:var(--r2)}.fxFrame.on{border-color:var(--goldline);background:var(--goldsoft)}
/* drawer · sheet · trim */
.shade,.ov{background:#000000b3;backdrop-filter:blur(2px)}
.drawer{background:var(--bg2);border-right:1px solid var(--line)}
.logo{border-radius:12px}
.pj{border-radius:var(--r2);padding:11px 12px}
.pj.on{background:var(--goldsoft);border-color:var(--goldline)}
.sheet,.trimBox{background:var(--bg2);border-color:var(--line2);border-radius:22px 22px 0 0;box-shadow:0 -12px 40px #0008}
.sheet .hd{padding:16px 16px 8px}.sheet .bd{padding:4px 16px 12px}.sheet .ft{padding:10px 16px 16px}
.sheet textarea,.sheet input{border-radius:var(--r2);border-color:var(--line2);background:var(--card)}
.sheet:before,.trimBox:before{content:'';display:block;width:40px;height:4px;border-radius:2px;background:var(--line2);margin:8px auto 0;flex:none}
.trCtl button,.trSet button{border-radius:10px;font-weight:600;background:var(--card);border-color:var(--line2)}
.toast{top:auto;bottom:96px;border-radius:14px;background:var(--card2);color:var(--g1);border:1px solid var(--goldline);box-shadow:0 10px 30px #0009;font-weight:600}
.empty{color:var(--dim)}
.warnl{border-radius:var(--r2)}
#msgIn::placeholder{color:var(--dim)}
@media(max-width:400px){.stx{gap:5px}.stx button{min-width:38px;height:36px}.sttime{font-size:11.5px;white-space:nowrap}.chip{font-size:13.5px;padding:6px 13px}}

    pct += 4; window.Recap.onBuild({ pct, text: pct < 15 ? '🎙 အသံ' : pct < 96 ? `🎬 အပိုင်း ${Math.ceil(pct / 96 * plan.lines.length)} / ${plan.lines.length}` : '🔗 ပေါင်းနေတယ်…' });
    if (pct >= 100) { clearInterval(t); window.Recap.onBuildDone({ ok: true, sec: C.totals([plan.lines], plan.rate).est, mb: 210.5, name: 'Zippy_Recap_preview.mp4', codec: 'hw' }); }
  }, 120);
}

  openProject(S.cur, false);
